name: Build PharmaDesk
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix double nested folder
        shell: pwsh
        run: |
          Write-Host "Before fix:"
          Get-ChildItem -Recurse -Depth 3 | Format-Table Name, FullName
          $tauri = Get-ChildItem -Recurse -Filter "tauri.conf.json" | Select-Object -First 1
          if (-not $tauri) { throw "tauri.conf.json not found!" }
          $projectRoot = Split-Path (Split-Path $tauri.FullName -Parent) -Parent
          Write-Host "Found project at: $projectRoot"
          Write-Host "Current dir: $PWD"
          if ($projectRoot -ne $PWD.Path) {
            Copy-Item -Path "$projectRoot/*" -Destination $PWD.Path -Recurse -Force
            Write-Host "Fixed! New structure:"
            Get-ChildItem | Format-Table Name
            Get-Content src-tauri/tauri.conf.json | Select-Object -First 5
          }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - uses: dtolnay/rust-toolchain@stable

      - run: npm install
      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: PharmaDesk-Windows-Setup
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
